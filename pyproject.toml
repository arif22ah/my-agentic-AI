[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-agentic-app"
version = "0.1.0"
description = "Self-healing code generator: planner, coder, sandboxed tester/linter, model escalation, human hints, FastAPI + live web UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "docker>=7.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Only needed for SANDBOX_MODE=local (generated code runs on your host).
# In docker mode, PyTorch lives inside the sandbox image instead.
local = ["torch>=2.4", "numpy>=1.26", "pytest>=8", "pytest-timeout>=2.3"]
dev = ["httpx>=0.27", "pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "langgraph-cli[inmem]>=0.3"]

[project.scripts]
selfheal = "my_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["my_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
